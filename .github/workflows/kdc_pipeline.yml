# .github/workflows/kdc_pipeline.yml
# Manually run the KDC-Solver build, batch, reporting, and animation pipeline.
# The workflow_dispatch inputs configure datasets, algorithms, modes,
# and artifacts.
name: KDC-Solver Pipeline
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      instances_dir:
        type: string
        default: data/instances
      algorithms:
        type: string
        default: all
      modes:
        type: choice
        options:
          - both
          - minmax
          - minsum
        default: both
      parallel:
        type: boolean
        default: true
      threads:
        type: string
        default: "4"
      dpi:
        type: string
        default: "150"
      retention_days:
        type: string
        default: "30"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
defaults:
  run:
    shell: bash
env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the source code for the build.
      - uses: actions/checkout@v4
      # Install the supported Python version and cache pip dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Cache CMake FetchContent sources between workflow runs.
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-
      # Install the repository's Python tooling dependencies.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # Configure without KONT so the built-in MockILPSolver is available.
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKONT_ROOT=""
      # Build the solver and its tests.
      - run: cmake --build build --parallel
      # Run the C++ test suite.
      - run: ctest --test-dir build --output-on-failure
      # Publish the solver binary for the batch job.
      - uses: actions/upload-artifact@v4
        with:
          name: kdc-solver-binaries
          path: build/kdc-solver
          retention-days: ${{ inputs.retention_days }}

  batch:
    name: Pre-flight and batch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Check out scripts and the selected input dataset.
      - uses: actions/checkout@v4
      # Download the solver binary built by the build job.
      - uses: actions/download-artifact@v4
        with:
          name: kdc-solver-binaries
          path: build/
      # Mark the downloaded solver binary as executable.
      - run: chmod +x build/kdc-solver
      # Install the supported Python version and cache pip dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Install the repository's Python tooling dependencies.
      - run: python -m pip install -r requirements.txt
      # Rebuild, test, and verify the pre-flight checks before batching.
      - run: python scripts/preflight_check.py --clean
      # Run selected algorithms and objectives, optionally in parallel.
      - env:
          INSTANCES_DIR: ${{ inputs.instances_dir }}
          ALGORITHMS: ${{ inputs.algorithms }}
          MODES: ${{ inputs.modes }}
          PARALLEL: ${{ inputs.parallel }}
          THREADS: ${{ inputs.threads }}
        run: |
          args=(
            --instances "$INSTANCES_DIR"
            --output results/batch
            --algorithms "$ALGORITHMS"
            --modes "$MODES"
          )
          if [[ "$PARALLEL" == "true" ]]; then
            args+=(--parallel --threads "$THREADS")
          fi
          python scripts/run_batch.py "${args[@]}"
      # Publish batch results and the pre-flight report for downstream jobs.
      - uses: actions/upload-artifact@v4
        with:
          name: batch-results
          path: |
            results/batch/
            results/preflight/
          retention-days: ${{ inputs.retention_days }}

  report:
    name: Build reports
    needs: batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Check out the reporting scripts.
      - uses: actions/checkout@v4
      # Download the batch results and pre-flight report.
      - uses: actions/download-artifact@v4
        with:
          name: batch-results
          path: results/
      # Install the supported Python version and cache pip dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Install the repository's Python tooling dependencies.
      - run: python -m pip install -r requirements.txt
      # Generate Markdown and CSV tables from the batch results.
      - run: |
          python scripts/build_tables.py \
            --input results/batch/master_results.json \
            --output results/tables
      # Generate comparison figures at the requested resolution.
      - env:
          DPI: ${{ inputs.dpi }}
        run: |
          python scripts/plot_comparisons.py \
            --input results/batch/master_results.json \
            --output results/figures \
            --dpi "$DPI"
      # Publish the report tables and figures.
      - uses: actions/upload-artifact@v4
        with:
          name: report-artifacts
          path: |
            results/tables/
            results/figures/
          retention-days: ${{ inputs.retention_days }}

  animate:
    name: Animate best solutions
    needs: batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Check out the animation script and instance data.
      - uses: actions/checkout@v4
      # Download the batch results and pre-flight report.
      - uses: actions/download-artifact@v4
        with:
          name: batch-results
          path: results/
      # Install the supported Python version and cache pip dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Install ffmpeg for MP4 animation output.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      # Install the repository's Python tooling dependencies.
      - run: python -m pip install -r requirements.txt
      # Create animations for the selected objective mode.
      - env:
          INSTANCES_DIR: ${{ inputs.instances_dir }}
          MODES: ${{ inputs.modes }}
          DPI: ${{ inputs.dpi }}
        run: |
          python scripts/animate_best.py \
            --batch results/batch \
            --instances "$INSTANCES_DIR" \
            --output results/animations \
            --mode "$MODES" \
            --dpi "$DPI"
      # Publish generated animations.
      - uses: actions/upload-artifact@v4
        with:
          name: animations
          path: results/animations/
          retention-days: ${{ inputs.retention_days }}

  summary:
    name: Pipeline summary
    needs: [build, batch, report, animate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Summarize all pipeline job results in the workflow run page.
      - env:
          BUILD_STATUS: ${{ needs.build.result }}
          BATCH_STATUS: ${{ needs.batch.result }}
          REPORT_STATUS: ${{ needs.report.result }}
          ANIMATE_STATUS: ${{ needs.animate.result }}
          SUMMARY_STATUS: ${{ job.status }}
        run: |
          {
            echo '| Job | Status | Notes |'
            echo '|---|---|---|'
            echo "| Build | $BUILD_STATUS | Compile and C++ tests |"
            echo "| Batch | $BATCH_STATUS | Pre-flight and batch results |"
            echo "| Report | $REPORT_STATUS | Tables and figures |"
            echo "| Animate | $ANIMATE_STATUS | Best-solution animations |"
            echo "| Summary | $SUMMARY_STATUS | Job status report |"
            echo
            echo 'See the Artifacts section of this workflow run for outputs.'
          } >> "$GITHUB_STEP_SUMMARY"
