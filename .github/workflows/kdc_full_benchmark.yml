name: KDC Full Scientific Benchmark
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats for stochastic algorithms
        type: number
        default: 3
      threads:
        description: Parallel worker count
        type: number
        default: 4
      fast_time_limit:
        description: Global limit per heuristic run, seconds
        type: number
        default: 30
      exact_time_limit:
        description: Global limit per exact run, seconds
        type: number
        default: 600
      static_time_limit:
        description: Limit per static solve, seconds
        type: number
        default: 60
      retention_days:
        description: Artifact retention days
        type: number
        default: 90
permissions:
  contents: read
concurrency:
  group: kdc-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    name: Full scientific benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install report dependencies and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Run full scientific benchmark
        env:
          REPEATS: ${{ inputs.repeats }}
          THREADS: ${{ inputs.threads }}
          FAST_LIMIT: ${{ inputs.fast_time_limit }}
          EXACT_LIMIT: ${{ inputs.exact_time_limit }}
          STATIC_LIMIT: ${{ inputs.static_time_limit }}
        run: |
          output="results/experiments/kdc-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/run_experiment.sh --pipeline full --output "$output" \
            --repeats "$REPEATS" --threads "$THREADS" \
            --fast-time-limit "$FAST_LIMIT" \
            --exact-time-limit "$EXACT_LIMIT" --time-limit "$STATIC_LIMIT"
      - name: Publish experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdc-full-${{ github.run_id }}
          path: results/experiments/kdc-full-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
      - name: Workflow summary
        if: always()
        env:
          EXPERIMENT_DIR: results/experiments/kdc-full-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "# Full scientific benchmark"
            echo
            echo "- Purpose: final all-algorithm analysis on the complete public dataset."
            echo "- Experiment: \`$EXPERIMENT_DIR\`"
            if [[ -f "$EXPERIMENT_DIR/experiment_manifest.json" ]]; then
              python scripts/experiment_pipeline.py emit-summary --experiment "$EXPERIMENT_DIR"
            else
              echo "- Status: initialization did not produce an experiment manifest."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
