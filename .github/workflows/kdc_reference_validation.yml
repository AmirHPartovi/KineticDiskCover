name: KDC Full Dataset Reference Validation
on:
  workflow_dispatch:
    inputs:
      approximation:
        description: Approximation/heuristic algorithm
        type: choice
        options:
          - nn
          - greedy
          - primal-dual
          - local-search
          - sa
          - genetic
          - lp-rounding
          - shifting
        default: greedy
      exact_backend:
        description: Exact-reference backend policy
        type: choice
        options: [auto, ip-kont, branch-and-bound]
        default: auto
      threads:
        description: Parallel worker count
        type: number
        default: 4
      retention_days:
        description: Artifact retention days
        type: number
        default: 30
permissions:
  contents: read
concurrency:
  group: kdc-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference:
    name: Full dataset reference validation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install report dependencies and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Run reference validation
        env:
          APPROXIMATION: ${{ inputs.approximation }}
          EXACT_BACKEND: ${{ inputs.exact_backend }}
          THREADS: ${{ inputs.threads }}
        run: |
          output="results/experiments/kdc-reference-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/run_experiment.sh --pipeline reference \
            --output "$output" --algorithms "$APPROXIMATION" \
            --exact-reference "$EXACT_BACKEND" --threads "$THREADS"
      - name: Publish experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdc-reference-${{ github.run_id }}
          path: results/experiments/kdc-reference-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
      - name: Workflow summary
        if: always()
        env:
          EXPERIMENT_DIR: results/experiments/kdc-reference-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "# Full dataset reference validation"
            echo
            echo "- Purpose: validate every public instance with one approximation and one resolved exact backend."
            echo "- Experiment: \`$EXPERIMENT_DIR\`"
            if [[ -f "$EXPERIMENT_DIR/experiment_manifest.json" ]]; then
              python scripts/experiment_pipeline.py emit-summary --experiment "$EXPERIMENT_DIR"
            else
              echo "- Status: initialization did not produce an experiment manifest."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
