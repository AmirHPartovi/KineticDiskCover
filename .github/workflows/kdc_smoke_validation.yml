name: KDC Smoke Validation
on:
  workflow_dispatch:
    inputs:
      max_n:
        description: Maximum trajectories for normal smoke selection
        type: number
        default: 50
      max_m:
        description: Maximum stations for normal smoke selection
        type: number
        default: 25
      retention_days:
        description: Artifact retention days
        type: number
        default: 14
permissions:
  contents: read
concurrency:
  group: kdc-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    name: End-to-end smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install report dependencies and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Run smoke pipeline
        env:
          SMOKE_MAX_N: ${{ inputs.max_n }}
          SMOKE_MAX_M: ${{ inputs.max_m }}
        run: |
          output="results/experiments/kdc-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/run_experiment.sh --pipeline smoke \
            --output "$output" \
            --smoke-max-n "$SMOKE_MAX_N" --smoke-max-m "$SMOKE_MAX_M"
          echo "EXPERIMENT_DIR=$output" >> "$GITHUB_ENV"
      - name: Publish experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdc-smoke-${{ github.run_id }}
          path: results/experiments/kdc-smoke-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
      - name: Workflow summary
        if: always()
        env:
          EXPERIMENT_DIR: results/experiments/kdc-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "# Smoke validation"
            echo
            echo "- Purpose: fast end-to-end development validation on a diverse, size-bounded smoke set."
            echo "- Experiment: \`$EXPERIMENT_DIR\`"
            if [[ -f "$EXPERIMENT_DIR/experiment_manifest.json" ]]; then
              python scripts/experiment_pipeline.py emit-summary --experiment "$EXPERIMENT_DIR"
            else
              echo "- Status: initialization did not produce an experiment manifest."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
