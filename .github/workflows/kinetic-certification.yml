name: Kinetic Differential Certification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinetic-certification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DBUILD_BENCHMARK=ON
      - name: Build tests and certification harness
        run: cmake --build build --target kdc-tests kdc-kinetic-certification -j2
      - name: Run complete C++ test suite
        run: ctest --test-dir build --output-on-failure
      - name: Run seeded differential and adversarial campaign
        run: |
          mkdir -p results/kinetic
          ./build/kdc-kinetic-certification 200 1 \
            > results/kinetic/differential.csv
      - name: Upload certification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-certification-${{ github.run_id }}
          path: results/kinetic/differential.csv
          if-no-files-found: warn
